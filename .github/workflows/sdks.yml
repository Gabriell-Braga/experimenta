# SDKs (servidor e React Native): o SDK TS gera sdks/test-vectors.json e cada linguagem confere decisão por decisão.
name: SDKs

on:
  push:
    paths:
      - 'sdks/**'
      - 'packages/sdk/**'
      - 'packages/react-native/**'
      - 'packages/snippet/src/bucket.ts'
      - 'packages/shared/src/**'
      - '.github/workflows/sdks.yml'
  pull_request:
    paths:
      - 'sdks/**'
      - 'packages/sdk/**'
      - 'packages/react-native/**'
      - 'packages/snippet/src/bucket.ts'
      - 'packages/shared/src/**'
      - '.github/workflows/sdks.yml'

permissions:
  contents: read

jobs:
  vectors:
    name: Vetores (SDK TS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # CI=true: o Vitest não reescreve o arquivo, só falha se estiver desatualizado.
      - run: pnpm --filter @abtest/sdk exec vitest run src/vectors.test.ts
      # React Native decide com o mesmo núcleo TS: confere os vetores pelo cliente do app (visitante = id do vetor).
      - run: pnpm --filter @abtest/react-native exec vitest run src/vectors.test.ts

  python:
    name: Python ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
      - run: python -m unittest discover -s tests -v

  php:
    name: PHP ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ['8.1', '8.4']
    defaults:
      run:
        working-directory: sdks/php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.version }}
          coverage: none
          tools: none
      - run: for f in src/*.php tests/*.php; do php -l "$f"; done
      - run: php tests/vectors_test.php

  go:
    name: Go ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ['1.21.x', '1.24.x']
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.version }}
          cache: false
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...

  java:
    name: Java ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        version: ['11', '21']
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.version }}
          cache: maven
      # Compila main e testes (release 11); os testes não usam framework, rodam por main.
      - run: mvn -B -q -DskipTests package
      - run: java -cp target/classes:target/test-classes com.experimenta.sdk.VectorsTest
