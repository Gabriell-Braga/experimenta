<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- CSP em meta (a extensão não remove): igual ao Instagram, bloqueia scripts de outros domínios. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'" />
    <title>Bloqueado (sem snippet) · Loja Demo</title>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <main>
      <h1 id="bloq-title">Página que bloqueia iframe (sem snippet)</h1>
      <p class="aviso">Sem snippet instalado: só a extensão consegue editar.</p>
    </main>
  </body>
</html>
