<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Snippet A/B: primeiro script do head (ver docs/DECISOES.md D-008) -->
    <script src="http://localhost:4000/cdn/demo.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja Demo</title>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/">Loja Demo</a>
      <nav class="main-nav">
        <a href="/">Início</a>
        <a href="/produto.html">Produto</a>
        <a href="/spa/">SPA</a>
      </nav>
    </header>
    <main>
      <section class="hero" id="hero">
        <h1 id="hero-title">O melhor tênis para correr</h1>
        <p class="hero-subtitle">Leve, confortável e com frete grátis.</p>
        <a class="btn btn-primary" data-testid="cta-comprar" href="/produto.html">Comprar agora</a>
        <img class="hero-img" src="/tenis.svg" alt="Tênis azul" width="320" height="200" />
      </section>
      <section class="features">
        <h2>Por que escolher</h2>
        <ul class="feature-list">
          <li>Amortecimento premium</li>
          <li>Solado antiderrapante</li>
          <li>Garantia de 1 ano</li>
        </ul>
      </section>
      <section class="pricing" id="a8f3c91e">
        <div class="plan">
          <h3>Básico</h3>
          <p class="price">R$ 199</p>
        </div>
        <div class="plan plan-featured">
          <h3>Pro</h3>
          <p class="price">R$ 299</p>
        </div>
      </section>
      <section class="newsletter">
        <form id="newsletter-form" action="#">
          <label>E-mail <input type="email" name="email" required /></label>
          <button type="submit" class="btn">Assinar</button>
          <output></output>
        </form>
      </section>
      <div id="late-slot"></div>
    </main>
    <footer class="site-footer"><p>© Loja Demo</p></footer>
    <script src="/site.js"></script>
  </body>
</html>
