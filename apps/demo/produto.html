<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- Snippet A/B: primeiro script do head (ver docs/DECISOES.md D-008) -->
    <script src="%VITE_API_URL%/cdn/demo.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produto · Loja Demo</title>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/">Loja Demo</a>
    </header>
    <main class="product">
      <h1 class="product-title">Tênis Runner X</h1>
      <p class="price">R$ 299</p>
      <button class="btn btn-primary" id="add-to-cart">Adicionar ao carrinho</button>
      <a href="/obrigado.html" class="btn">Finalizar compra</a>
      <form id="checkout" class="checkout" action="/obrigado.html" method="post">
        <h2>Entrega e pagamento</h2>
        <label>Nome completo <input name="nome" autocomplete="name" required /></label>
        <label>E-mail <input name="email" type="email" autocomplete="email" required /></label>
        <label>CEP <input name="cep" inputmode="numeric" autocomplete="postal-code" required /></label>
        <label
          >Número do cartão <input name="cartao" inputmode="numeric" autocomplete="cc-number" required
        /></label>
        <label><input type="checkbox" name="presente" /> É para presente</label>
        <button type="submit" class="btn btn-primary">Pagar R$ 299</button>
      </form>
      <script>
        // Dados do checkout nunca vão para a URL (ficariam em histórico, analytics e gravações).
        document.getElementById('checkout').addEventListener('submit', (e) => {
          e.preventDefault();
          setTimeout(() => location.assign('/obrigado.html'), 0);
        });
      </script>
    </main>
  </body>
</html>
